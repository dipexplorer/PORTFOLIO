<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- Cyan 400 -->
      <stop offset="100%" stop-color="#0284c7" /> <!-- Light Blue 600 -->
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" /> <!-- Cyan 600 -->
      <stop offset="100%" stop-color="#38bdf8" /> <!-- Light Blue 400 -->
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="#020617"/>
  
  <!-- Tech corner accents -->
  <path d="M 15 25 L 15 15 L 25 15" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M 85 25 L 85 15 L 75 15" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
