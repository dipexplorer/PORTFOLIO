  <path d="M 85 75 L 85 85 L 75 85" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

  <!-- Left 'D' -->
  <path d="M 18 25 L 18 75 L 34 75 C 51 75 58 63 58 50 C 58 37 51 25 34 25 Z" fill="none" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right 'D' -->
  <path d="M 42 25 L 42 75 L 58 75 C 75 75 82 63 82 50 C 82 37 75 25 58 25 Z" fill="none" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
