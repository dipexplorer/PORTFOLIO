<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Vibrant Glowing Cyan -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- cyan-400 -->
      <stop offset="100%" stop-color="#0284c7" /> <!-- sky-600 -->
    </linearGradient>
    
    <!-- Deep Futuristic Blue -->
    <linearGradient id="neonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" /> <!-- sky-500 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- blue-500 -->
    </linearGradient>

    <!-- Subtle Glow Filter for the data line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Slate Glass Background -->
  <rect width="100" height="100" rx="22" fill="#020617"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="#0f172a" stroke-width="4"/>
  
  <!-- Cyberpunk Frame Corners -->
  <path d="M 18 28 L 18 18 L 28 18" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M 82 28 L 82 18 L 72 18" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M 18 72 L 18 82 L 28 82" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M 82 72 L 82 82 L 72 82" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <!-- Vertical Core Pillar -->
  <path d="M 26 28 L 26 72" stroke="url(#neonCyan)" stroke-width="10" stroke-linecap="round" />
  
  <!-- Floating D Blade -->
  <path d="M 41 28 C 71 28 83 40 83 50 C 83 60 71 72 41 72" fill="none" stroke="url(#neonBlue)" stroke-width="10" stroke-linecap="round" />
  
  <!-- Intersecting Data Line -->
  <line x1="14" y1="50" x2="48" y2="50" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Glowing Core Node -->
  <circle cx="48" cy="50" r="4.5" fill="#020617" stroke="#22d3ee" stroke-width="2.5" />
  <circle cx="48" cy="50" r="1.5" fill="#e0f2fe" filter="url(#glow)" />
</svg>
